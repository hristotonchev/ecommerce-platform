name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Nest.js Tests ───────────────────────────────────────
  nestjs:
    name: Nest.js Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install dependencies
        working-directory: api-gateway
        run: npm ci

      - name: Run unit tests
        working-directory: api-gateway
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_test
          DB_USER: ecommerce_user
          DB_PASS: secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key
          API_KEY: test-api-key
        run: npm run test

      - name: Build
        working-directory: api-gateway
        run: npm run build

  # ─── Laravel Tests ───────────────────────────────────────
  laravel:
    name: Laravel Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, redis
          coverage: none

      - name: Install dependencies
        working-directory: admin-service
        run: composer install --no-interaction --prefer-dist

      - name: Setup environment
        working-directory: admin-service
        run: |
          cp .env.example .env
          php artisan key:generate


      - name: Run tests
        working-directory: admin-service
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ecommerce
          DB_USERNAME: ecommerce_user
          DB_PASSWORD: secret
          SESSION_DRIVER: file
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: php artisan test

  # ─── Docker Build ─────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [nestjs, laravel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Nest.js image
        run: docker build -t ecommerce-api:${{ github.sha }} ./api-gateway

      - name: Build Laravel image
        run: docker build -t ecommerce-admin:${{ github.sha }} ./admin-service

      - name: Test docker-compose
        run: |
          docker compose config
          echo "Docker Compose config is valid"
